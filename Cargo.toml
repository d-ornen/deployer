[package]
name = "deployer"
version = "1.3.5"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.50"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "2"
ctrlc = "3.4"
dirs = "5.0"
env-file-reader = "0.3"
fs_extra = "1.2"
indicatif = "0.17"
inquire = { optional = true, git = "https://github.com/markcda/inquire.git", branch = "feat/reorder-values", features = ["reorder"] }
mimalloc = "0.1.43"
regex = "1.11"
russh = "0.49"
safe-path = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smart-patcher = { git = "https://github.com/impulse-sw/smart-patcher", tag = "0.2.1", default-features = false }
strip-ansi-escapes = "0.2"
termimad = "0.20"
tokio = { version = "1.0", features = ["rt-multi-thread", "io-std"] }
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
vaultrs = "0.7"

[features]
default = ["python", "lua", "rhai", "tui", "containered"]
tests = []
i18n-ru = []
python = ["smart-patcher/python"]
lua = ["smart-patcher/lua"]
rhai = ["smart-patcher/rhai"]
tui = ["dep:inquire"]
containered = []

[profile.release]
codegen-units = 1
lto = true
