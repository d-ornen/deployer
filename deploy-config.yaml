        ignore_fails: false
        show_success_output: false
        show_bash_c: true
    requirements:
    - type: exists_any
      paths:
      - /bin/cargo
      - ~/.cargo/bin/cargo
  default: false
  containered_opts:
    preflight_cmds:
    - RUN apt-get update && apt-get install -y build-essential curl git && rm -rf /var/lib/apt/lists/*
    - RUN curl https://sh.rustup.rs -sSf | bash -s -- -y --profile minimal --default-toolchain nightly
    - ENV PATH="/root/.cargo/bin:${PATH}"
    - RUN rustup component add clippy
    cache_strategies:
    - fake_content: docker-fake-files@0.1.0
      copy_cmds:
      - COPY rust-toolchain.toml .
      - COPY .docker-fake-files/rust/lib.rs src/lib.rs
      - COPY .docker-fake-files/rust/main.rs src/main.rs
      - COPY Cargo.toml .
      - COPY deploy-config.json .
      pre_cache_cmds:
      - DEPL
    - copy_cmds:
      - COPY src/ src/
      - COPY DOCS.en.md .
      - COPY DOCS.ru.md .
      pre_cache_cmds:
      - RUN touch src/main.rs
      - RUN touch src/lib.rs
      - DEPL
  exclusive_exec_tag: containered
artifacts:
- target/release/deployer
variables: []
place_artifacts_into_project_root:
- from: target/release/deployer
  to: deployer
