[[pipelines]]
title = "containered"
desc = "Got from `Deployer Pipeline`."
info = "deployer-default@0.1.2"
tags = [
    "cargo",
    "clippy",
    "build",
]
default = false
exclusive_exec_tag = "containered"

[[pipelines.actions]]
title = "Lint"
desc = "Got from `Cargo Clippy`."
info = "cargo-clippy@0.1.0"
tags = [
    "cargo",
    "clippy",
]

[pipelines.actions.action]
type = "pre_build"
supported_langs = ["rust"]

[[pipelines.actions.action.commands]]
bash_c = "cargo clippy --no-default-features --features=lua,rhai,tui,containered"
ignore_fails = false
show_success_output = true
show_bash_c = true

[[pipelines.actions.requirements]]
type = "exists_any"
paths = [
    "/bin/cargo",
    "~/.cargo/bin/cargo",
]

[[pipelines.actions]]
title = "Build"
desc = "Got from `Cargo Build (Release)`. Build the Rust project with Cargo default settings in release mode"
info = "cargo-rel@0.1"
tags = [
    "rust",
    "cargo",
]

[pipelines.actions.action]
type = "build"
supported_langs = ["rust"]

[[pipelines.actions.action.commands]]
bash_c = "RUSTFLAGS='-Zthreads=16' cargo build --release --no-default-features --features=lua,rhai,tui,containered"
ignore_fails = false
show_success_output = false
show_bash_c = true

[[pipelines.actions.requirements]]
type = "exists_any"
paths = [
    "/bin/cargo",
    "~/.cargo/bin/cargo",
]

[pipelines.containered_opts]
preflight_cmds = [
    "RUN apt-get update && apt-get install -y build-essential curl git && rm -rf /var/lib/apt/lists/*",
    "RUN curl https://sh.rustup.rs -sSf | bash -s -- -y --profile minimal --default-toolchain nightly",
    'ENV PATH="/root/.cargo/bin:${PATH}"',
    "RUN rustup component add clippy",
]

[[pipelines.containered_opts.cache_strategies]]
fake_content = "docker-fake-files@0.1.0"
copy_cmds = [
    "COPY rust-toolchain.toml .",
    "COPY .docker-fake-files/rust/lib.rs src/lib.rs",
    "COPY .docker-fake-files/rust/main.rs src/main.rs",
    "COPY Cargo.toml .",
    "COPY .deploy-config.toml .",
]
pre_cache_cmds = ["DEPL"]

[[pipelines.containered_opts.cache_strategies]]
copy_cmds = [
    "COPY src/ src/",
    "COPY DOCS.en.md .",
    "COPY DOCS.ru.md .",
]
pre_cache_cmds = [
    "RUN touch src/main.rs",
    "RUN touch src/lib.rs",
    "DEPL",
]

