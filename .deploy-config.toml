project_name = "deployer"
langs = ["rust"]
cache_files = [
    ".git",
    "Cargo.lock",
    "target",
]
artifacts = ["target/release/deployer"]
variables = []
version = 4

[[targets]]
arch = "x86_64"
os = "Linux"
os_derivative = "any"

[targets.os_version]
type = "no"

[[pipelines]]
title = "en"
desc = "Got from `Deployer Pipeline`."
info = "deployer-default@0.1.0"
tags = [
    "cargo",
    "clippy",
    "build",
    "upx",
]
default = true

[[pipelines.actions]]
title = "Lint"
desc = "Got from `Cargo Clippy`."
info = "cargo-clippy@0.1.0"
tags = [
    "cargo",
    "clippy",
]

[pipelines.actions.action]
type = "pre_build"
supported_langs = ["rust"]

[[pipelines.actions.action.commands]]
bash_c = "cargo clippy --no-default-features --features=lua,rhai,tui,containered"
ignore_fails = false
show_success_output = true
show_bash_c = true

[[pipelines.actions.requirements]]
type = "exists_any"
paths = [
    "/bin/cargo",
    "~/.cargo/bin/cargo",
]

[[pipelines.actions]]
title = "Format"
desc = "Format `.rs` files"
info = "cargo-fmt@0.1.0"
tags = [
    "rust",
    "cargo",
    "fmt",
]
exec_in_project_dir = true

[pipelines.actions.action]
type = "pre_build"
supported_langs = ["rust"]

[[pipelines.actions.action.commands]]
bash_c = "cargo fmt -- --config tab_spaces=2,max_width=120 */**/*.rs"
ignore_fails = false
show_success_output = false
show_bash_c = true
only_when_fresh = false

[[pipelines.actions]]
title = "Build"
desc = "Got from `Cargo Build (Release)`. Build the Rust project with Cargo default settings in release mode"
info = "cargo-rel@0.1"
tags = [
    "rust",
    "cargo",
]

[pipelines.actions.action]
type = "build"
supported_langs = ["rust"]

[[pipelines.actions.action.commands]]
bash_c = "RUSTFLAGS='-Zthreads=16' cargo build --release --no-default-features --features=lua,rhai,tui,containered"
ignore_fails = false
show_success_output = false
show_bash_c = true

[[pipelines.actions.requirements]]
type = "exists_any"
paths = [
    "/bin/cargo",
    "~/.cargo/bin/cargo",
]

[[pipelines.actions]]
title = "Compress"
desc = "Got from `UPX Compress`."
info = "upx@0.1.0"
tags = ["upx"]

[pipelines.actions.action]
type = "post_build"
supported_langs = ["any"]

[[pipelines.actions.action.commands]]
bash_c = "upx <artifact>"
placeholders = ["<artifact>"]
ignore_fails = false
show_success_output = false
show_bash_c = false

